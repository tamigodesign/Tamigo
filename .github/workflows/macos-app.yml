name: macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/accessibility-intelligence-0cba
    paths-ignore:
      - "README.md"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: Tamigo-macos-intel
            machine: x86_64
          - runner: macos-14
            artifact: Tamigo-macos-apple-silicon
            machine: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.6"
          python -m pytest -q
          python -c "import platform; print(platform.machine(), platform.mac_ver())"
      - name: Build Finder app
        run: PYTHON="$(command -v python)" bash scripts/build_macos_app.sh
      - name: Frozen self-check and real search
        env:
          EXPECT_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          echo "uname: $(uname -m)"
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          if [[ "$(uname -m)" != "$EXPECT_MACHINE" ]]; then
            echo "Runner nije $EXPECT_MACHINE." >&2
            exit 1
          fi
          if [[ "$EXPECT_MACHINE" == "x86_64" ]]; then
            case "$(sw_vers -productVersion)" in
              15.*) ;;
              *)
                echo "Intel paket se gradi na macOS 15 Sequoia. Runner javlja $(sw_vers -productVersion)." >&2
                exit 1
                ;;
            esac
          fi
          APP="dist/Tamigo Accessibility Intelligence.app"
          BIN="$APP/Contents/MacOS/Tamigo Accessibility Intelligence"
          test -x "$BIN"
          file "$BIN"
          export TAMIGO_INTEL_HOME="${RUNNER_TEMP}/tamigo-home"
          "$BIN" --self-check
          "$BIN" --search --max-organizations 3
          if [[ -f "${TAMIGO_INTEL_HOME}/search-result.json" ]]; then
            echo "Search result:"
            cat "${TAMIGO_INTEL_HOME}/search-result.json"
          fi
          "$BIN" --stats
          cp "${TAMIGO_INTEL_HOME}/stats.json" "${RUNNER_TEMP}/stats-first.json"
          "$BIN" --stats
          python - << 'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ["TAMIGO_INTEL_HOME"])
          payload = json.loads((home / "self-check.json").read_text())
          assert payload["frozen"] is True, payload
          assert payload["platform"] == "darwin", payload
          assert payload["version"] == "0.2.0"
          assert payload["machine"] == os.environ["EXPECT_MACHINE"], payload
          first = json.loads(Path(os.environ["RUNNER_TEMP"], "stats-first.json").read_text())
          second = json.loads((home / "stats.json").read_text())
          print(payload)
          print(second)
          assert first["organizations"] >= 1, first
          assert second["leads"] == first["leads"]
          assert second["leads"] >= 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
